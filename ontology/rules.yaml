version: "0.1.0"
name: stock-ontology-mvp-rules
description: >-
  Deterministic rules for the A-share humanoid-robot ontology MVP.
  Rules derive business relevance and exposure only. They never infer stock-price
  direction, investment ratings, or trading actions.

constants:
  accepted_claim_statuses:
    - ACCEPTED
  verified_business_stages:
    - SMALL_BATCH
    - MASS_PRODUCTION
    - REVENUE_DISCLOSED
  active_claim_time_rule: >-
    valid_from is null or valid_from <= as_of, and valid_to is null or valid_to > as_of;
    recorded_at <= query_time, and superseded_at is null or superseded_at > query_time
  authoritative_text_sources:
    - ANNUAL_REPORT
    - SEMI_ANNUAL_REPORT
    - PROSPECTUS
    - EXCHANGE_ANNOUNCEMENT
    - INTERACTION_REPLY
    - SURVEY_RECORD

rules:
  - id: R001_VERIFIED_THEME_RELEVANCE
    name: 已验证主题相关性
    enabled: true
    priority: 100
    input_fact_layers:
      - SOURCE_FACT
      - NORMALIZED_FACT
    when:
      all:
        - accepted_claim:
            predicate: PRODUCES
            subject_type: Company
            object_type: Product
        - claim_business_stage_in:
            values:
              - SMALL_BATCH
              - MASS_PRODUCTION
              - REVENUE_DISCLOSED
        - path_exists:
            from: claim.object
            path:
              - relation: skos:broader
                min_hops: 0
                max_hops: 4
              - relation: stock:partOfTheme
            to_type: Theme
        - active_at_query_time: true
        - evidence_required: true
    emit:
      predicate: VERIFIED_RELEVANT_TO
      fact_layer: INFERRED_FACT
      subject: claim.subject
      object: path.target
      confidence:
        method: minimum
        inputs:
          - claim.confidence
          - product_mapping.confidence
    explanation_template_zh: >-
      {company}生产{product}，业务阶段为{business_stage}；该产品通过
      {taxonomy_path}属于{theme}，因此形成已验证的业务相关性。

  - id: R002_CLASSIFICATION_ONLY
    name: 只有平台概念标签
    enabled: true
    priority: 90
    when:
      all:
        - accepted_or_structured_claim:
            predicate: TAGGED_AS
            subject_type: Company
            object_type: Concept
        - not_exists:
            accepted_business_claim_for_same_theme:
              predicates:
                - PRODUCES
                - DEVELOPS
              stages:
                - SAMPLE_VALIDATION
                - SMALL_BATCH
                - MASS_PRODUCTION
                - REVENUE_DISCLOSED
    emit:
      state: CLASSIFICATION_ONLY
      fact_layer: INFERRED_FACT
      predicate: HAS_RELEVANCE_STATE
      object_literal: CLASSIFICATION_ONLY
    explanation_template_zh: >-
      {company}被{source_platform}归入{concept}，但截至{as_of}尚未找到经过
      验证的产品或经营事实；该结果只能解释为平台分类，不能解释为已形成业务。

  - id: R003_DIRECT_BUSINESS_EXPOSURE
    name: 直接经营暴露
    enabled: true
    priority: 80
    when:
      all:
        - inferred_or_normalized_fact:
            predicate: VERIFIED_RELEVANT_TO
        - product_distance_to_theme:
            max_component_hops: 1
    emit:
      predicate: DIRECT_EXPOSURE_TO
      fact_layer: INFERRED_FACT
      subject: input.subject
      object: input.object
    explanation_template_zh: >-
      {company}直接生产属于{theme}的{product}，因此具有直接经营暴露。

  - id: R004_SECOND_ORDER_BUSINESS_EXPOSURE
    name: 二阶经营暴露
    enabled: true
    priority: 70
    when:
      all:
        - accepted_claim:
            predicate: PRODUCES
            subject_type: Company
            object_type: Product
        - component_path_exists:
            path_relations:
              - COMPONENT_OF
              - skos:broader
            min_hops: 2
            max_hops: 3
            target_theme_required: true
        - active_at_query_time: true
        - evidence_required: true
    emit:
      predicate: SECOND_ORDER_EXPOSURE_TO
      fact_layer: INFERRED_FACT
      subject: claim.subject
      object: component_path.theme
    explanation_template_zh: >-
      {company}生产{component}，该产品通过{component_path}进入{theme}产业链，
      因而属于二阶经营暴露。

  - id: R005_REVENUE_EVIDENCE
    name: 产品收入证据
    enabled: true
    priority: 95
    when:
      all:
        - business_segment_exists: true
        - segment_product_mapping_status: ACCEPTED
        - segment_revenue:
            operator: gt
            value: 0
        - report_period_not_null: true
    emit:
      predicate: HAS_REVENUE_EVIDENCE
      fact_layer: NORMALIZED_FACT
      subject: business_segment.company
      object: business_segment.product
      business_stage: REVENUE_DISCLOSED
      valid_from: business_segment.report_period
    explanation_template_zh: >-
      {company}在{report_period}主营构成中披露{product}相关收入{revenue}{currency}。

  - id: R006_COMPANY_DENIAL
    name: 公司明确否认
    enabled: true
    priority: 110
    when:
      all:
        - accepted_claim:
            predicate: DENIES
            subject_type: Company
        - source_type_in:
            values:
              - EXCHANGE_ANNOUNCEMENT
              - INTERACTION_REPLY
              - ANNUAL_REPORT
        - evidence_quote_required: true
        - active_at_query_time: true
    emit:
      predicate: HAS_RELEVANCE_STATE
      fact_layer: NORMALIZED_FACT
      subject: claim.subject
      object_literal: DENIED
      business_stage: DENIED
    explanation_template_zh: >-
      {company}在{document_type}中明确否认{object_text}，原文为：“{quote}”。

  - id: R007_PRODUCTION_DENIAL_CONFLICT
    name: 量产与否认时态冲突
    enabled: true
    priority: 120
    when:
      all:
        - two_claims_same_subject_and_business_object: true
        - claim_a_business_stage_in:
            values:
              - MASS_PRODUCTION
              - REVENUE_DISCLOSED
        - claim_b_business_stage_in:
            values:
              - DENIED
        - valid_intervals_overlap: true
        - neither_supersedes_the_other: true
    emit:
      conflict_type: TEMPORAL_LOGICAL_CONFLICT
      severity: CRITICAL
      automatic_resolution: false
      review_queue: DOMAIN_EXPERT
    explanation_template_zh: >-
      同一公司和业务对象在重叠有效期内同时存在“量产/收入”和“否认”事实，
      必须进行人工核验，不能自动选择其中一条。

  - id: R008_SHAREHOLDING_NOT_CONTROL
    name: 持股不自动推出控制
    enabled: true
    priority: 100
    when:
      all:
        - claim_predicate: HOLDS
        - no_authoritative_control_claim: true
    emit:
      prohibited_inference: CONTROLS
      review_hint: >-
        控制关系需要年报、招股书、公告或明确的一致行动/表决权安排证据。

  - id: R009_UNKNOWN_IS_NOT_FALSE
    name: 未知不等于否定
    enabled: true
    priority: 130
    when:
      all:
        - no_matching_accepted_claim: true
        - no_explicit_denial_claim: true
    emit:
      result_state: EVIDENCE_INSUFFICIENT
      prohibited_result_states:
        - FALSE
        - DENIED
    explanation_template_zh: >-
      截至{as_of}未找到满足条件的已验证证据，但也没有明确否认，结果应为
      “证据不足”，而不是“没有该业务”。

  - id: R010_PLATFORM_TAG_IS_NOT_PRODUCTION
    name: 平台标签不得升级为经营事实
    enabled: true
    priority: 140
    when:
      all:
        - input_claim_predicate: TAGGED_AS
        - input_evidence_state: PLATFORM_TAG
    emit:
      prohibited_predicates:
        - PRODUCES
        - DEVELOPS
        - HAS_REVENUE_EVIDENCE
      prohibited_business_stages:
        - SAMPLE_VALIDATION
        - SMALL_BATCH
        - MASS_PRODUCTION
        - REVENUE_DISCLOSED

  - id: R011_NO_PRICE_DIRECTION_INFERENCE
    name: 禁止从经营暴露推出股价方向
    enabled: true
    priority: 1000
    when:
      any:
        - input_predicate: DIRECT_EXPOSURE_TO
        - input_predicate: SECOND_ORDER_EXPOSURE_TO
        - input_predicate: VERIFIED_RELEVANT_TO
    emit:
      prohibited_predicates:
        - STOCK_PRICE_WILL_RISE
        - STOCK_PRICE_WILL_FALL
        - BUY
        - SELL
      mandatory_disclaimer_zh: >-
        该结论描述业务或产业链关系，不代表证券价格方向或投资建议。

review_policy:
  auto_accept:
    required_conditions:
      - shacl_conforms
      - quote_grounding_passed_or_structured_source
      - no_high_or_critical_conflict
      - entity_resolution_confidence_gte: 0.98
      - product_mapping_confidence_gte: 0.95
      - claim_confidence_gte: 0.92
  manual_review_required_when:
    - conflict_severity_in: [HIGH, CRITICAL]
    - predicate_in: [CONTROLS, SUPPLIES_TO]
    - business_stage_in: [MASS_PRODUCTION, REVENUE_DISCLOSED, DENIED]
    - product_mapping_status_in: [AMBIGUOUS]
    - quote_grounding_failed: true

execution:
  max_taxonomy_hops: 4
  max_component_hops: 3
  persist_inferred_facts: true
  inferred_fact_ttl_hours: 24
  include_rule_version_in_claim: true
  deterministic_only: true
