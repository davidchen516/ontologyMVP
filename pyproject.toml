[project]
name = "ontology-mvp"
version = "0.1.0"
description = "股票本体查询系统 MVP（TuShare + Semantica + PostgreSQL + Neo4j）"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    # 语义运行时：精确锁版（ADR-0003）；仅 src/semantic/semantica_adapter.py 及其测试允许导入
    "semantica==0.7.0",
    # semantica[shacl] extra：SHACL 校验引擎（validate_claim/validate_graph 依赖）
    "pyshacl>=0.26,<0.31",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "structlog>=24.1,<26",
    "psycopg[binary]>=3.2,<4",
    "neo4j>=5.23,<6",
    "alembic>=1.13,<2",
    "sqlalchemy>=2,<3",
    "httpx>=0.27,<1",
    "PyYAML>=6,<7",
    "rdflib>=7,<8",
    "pypdf>=4,<7",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-cov>=7,<8",
    "httpx>=0.27,<1",
    "ruff>=0.6",
    "rdflib>=7,<8",
    "PyYAML>=6,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "apps", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501"]  # DDL 列定义与设计文档逐列对齐

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
# 分层标记（issue #10）：CI 按层选择；fault/golden/security 标记附加在
# 具体测试上（同层可叠加）。默认全套运行，无标记的测试按目录归层。
markers = [
    "unit: 快速单元测试，无外部依赖（默认层）",
    "contract: 外部端口契约测试（Semantica/TuShare/文档源 Fixture）",
    "integration: 需要真实服务的集成测试（PostgreSQL/Neo4j service）",
    "e2e: 端到端场景测试（API 全链路）",
    "golden: 黄金查询回归（期望结果文件驱动）",
    "fault: 故障注入（事务中断/并发/崩溃恢复/超时）",
    "security: 安全负向场景（注入/越权/脱敏）",
    "performance: 性能与基准（默认不在 PR 门禁运行）",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "src/semantic/semantica_adapter.py",  # 契约测试单独覆盖（tests/semantic）
]

[tool.coverage.report]
# 全套件（unit + DB）发布门禁（issue #10 验收 10）；当前 89.7%，
# 阈值 88% 允许小幅波动但不允许显著回退；apps/scripts 不在 src 覆盖范围
fail_under = 88
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
