[project]
name = "ontology-mvp"
version = "0.1.0"
description = "股票本体查询系统 MVP（TuShare + Semantica + PostgreSQL + Neo4j）"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    # 语义运行时：精确锁版（ADR-0003）；仅 src/semantic/semantica_adapter.py 及其测试允许导入
    "semantica==0.7.0",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "structlog>=24.1,<26",
    "psycopg[binary]>=3.2,<4",
    "neo4j>=5.23,<6",
    "alembic>=1.13,<2",
    "sqlalchemy>=2,<3",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "httpx>=0.27,<1",
    "ruff>=0.6",
    "rdflib>=7,<8",
    "PyYAML>=6,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "apps", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501"]  # DDL 列定义与设计文档逐列对齐

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
