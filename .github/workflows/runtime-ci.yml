name: Runtime CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv (pinned Python 3.11)
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install locked dependencies
        # --frozen：锁文件缺失或不一致时立即失败，绝不现场解析新版本
        run: uv sync --frozen

      - name: Static check (ruff)
        run: uv run ruff check .

      - name: Unit and integration tests
        # 不依赖真实 PostgreSQL/Neo4j：故障场景用不可达端口注入
        run: uv run pytest

      - name: Validate design assets
        run: uv run python scripts/validate_design.py

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          # v2 破坏性更新：扫描 PR 必须显式提供 GITHUB_TOKEN
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
