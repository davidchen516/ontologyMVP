title: ontologyMVP
description: 面向 A 股产业研究的可追溯股票本体查询系统设计与开源使用指南
url: https://davidchen516.github.io
baseurl: /ontologyMVP
repository: davidchen516/ontologyMVP
lang: zh-CN

source: docs
destination: _site
theme: just-the-docs
color_scheme: light

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default

logo: /assets/images/mark.svg
favicon_ico: /assets/images/favicon.svg

search_enabled: true
search:
  heading_level: 3
  previews: 3
  preview_words_before: 8
  preview_words_after: 12
  rel_url: true
  button: true
  focus_shortcut_key: k

heading_anchors: true
nav_enabled: true
nav_sort: case_insensitive
back_to_top: true
back_to_top_text: 返回顶部
enable_copy_code_button: true

aux_links:
  GitHub 仓库:
    - https://github.com/davidchen516/ontologyMVP
  V0.1 Epic:
    - https://github.com/davidchen516/ontologyMVP/issues/12
  V0.2 界面 Epic:
    - https://github.com/davidchen516/ontologyMVP/issues/29
aux_links_new_tab: true

gh_edit_link: true
gh_edit_link_text: 在 GitHub 上改进此页
gh_edit_repository: https://github.com/davidchen516/ontologyMVP
gh_edit_branch: main
gh_edit_source: docs
gh_edit_view_mode: edit

mermaid:
  version: "12.0.0"

callouts:
  note:
    title: 注意
    color: blue
  warning:
    title: 重要
    color: yellow

kramdown:
  syntax_highlighter_opts:
    block:
      line_numbers: false

exclude:
  - README.md
